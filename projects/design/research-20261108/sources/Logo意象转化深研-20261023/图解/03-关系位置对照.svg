<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="510" viewBox="0 0 1270 510"><rect width="1270" height="510" fill="#f5f4f0"/><text x="24" y="40" font-size="28" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">研究图 3｜物体没变，位置关系已经改变</text><rect x="24" y="66" width="288" height="340" rx="8" fill="white"/><text x="44" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">横条在下方且接近</text><circle cx="168" cy="220" r="61" fill="none" stroke="#17618c" stroke-width="21"/><rect x="108" y="310" width="120" height="20" fill="#47834d"/><rect x="334" y="66" width="288" height="340" rx="8" fill="white"/><text x="354" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">横条移到上方</text><circle cx="478" cy="220" r="61" fill="none" stroke="#17618c" stroke-width="21"/><rect x="418" y="111" width="120" height="20" fill="#47834d"/><rect x="644" y="66" width="288" height="340" rx="8" fill="white"/><text x="664" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">横条向一侧偏移</text><circle cx="788" cy="220" r="61" fill="none" stroke="#17618c" stroke-width="21"/><rect x="808" y="310" width="120" height="20" fill="#47834d"/><rect x="954" y="66" width="288" height="340" rx="8" fill="white"/><text x="974" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">横条仍在下方但远离</text><circle cx="1098" cy="220" r="61" fill="none" stroke="#17618c" stroke-width="21"/><rect x="1038" y="366" width="120" height="20" fill="#47834d"/><text x="24" y="448" font-size="18" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">自制基础形示意，受 Conservation International 案例启发；不是该品牌的规范或改稿建议。</text><text x="24" y="480" font-size="18" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">研究问题：承托、遮盖、失衡、分离等读法中，哪些来自位置，哪些需要语境？</text></svg>