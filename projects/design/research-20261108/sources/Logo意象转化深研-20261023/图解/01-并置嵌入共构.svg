<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="535" viewBox="0 0 1330 535"><rect width="1330" height="535" fill="#f5f4f0"/><text x="24" y="40" font-size="28" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">研究图 1｜同样两个意象，结构关系可以不同</text><rect x="24" y="66" width="408" height="400" rx="8" fill="white"/><text x="44" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">并置：两件物体</text><g transform="translate(135,230) scale(.7)"><path d="M-76 -105 L76 -105 L103 93 Q39 113 23 176 L-23 176 Q-39 113 -103 93Z" fill="#202425"/></g><g transform="translate(322,245) scale(0.8)"><path d="M0 -62 C-37 -62 -44 -13 -25 8 C-17 16 -7 18 -6 34 L-5 112 L5 112 L6 34 C7 18 17 16 25 8 C44 -13 37 -62 0 -62Z" fill="#202425"/></g><text x="44" y="435" font-size="18" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">两者各自完整，靠位置建立联系</text><rect x="454" y="66" width="408" height="400" rx="8" fill="white"/><text x="474" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">嵌入：一个轮廓装另一个</text><g transform="translate(657,235) scale(.9)"><path d="M-76 -105 L76 -105 L103 93 Q39 113 23 176 L-23 176 Q-39 113 -103 93Z" fill="#202425"/><g transform="translate(0,-5) scale(0.63)"><path d="M0 -62 C-37 -62 -44 -13 -25 8 C-17 16 -7 18 -6 34 L-5 112 L5 112 L6 34 C7 18 17 16 25 8 C44 -13 37 -62 0 -62Z" fill="white"/></g></g><text x="474" y="435" font-size="18" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">勺柄止于内部，主要是图中藏图</text><rect x="884" y="66" width="408" height="400" rx="8" fill="white"/><text x="904" y="100" font-size="21" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">共构：留白承担两项任务</text><g transform="translate(1087,235) scale(.9)"><path d="M-76 -105 L76 -105 L103 93 Q39 113 23 176 L-23 176 Q-39 113 -103 93Z" fill="#202425"/><g transform="translate(0,-5) scale(0.98)"><path d="M0 -62 C-37 -62 -44 -13 -25 8 C-17 16 -7 18 -6 34 L-5 190 L5 190 L6 34 C7 18 17 16 25 8 C44 -13 37 -62 0 -62Z" fill="white"/></g></g><text x="904" y="435" font-size="18" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">勺柄通向外部，同时成为笔尖中缝</text><text x="24" y="506" font-size="18" fill="#222" font-weight="400" font-family="Microsoft YaHei, sans-serif">分析性重构示意；不是 GFW 原稿，也不是其真实草图过程。三种关系没有脱离任务的统一优劣。</text></svg>